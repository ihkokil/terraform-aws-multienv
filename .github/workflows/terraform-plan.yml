name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  changes:
    name: "Detect Environment Changes"
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.filter.outputs.dev }}
      staging: ${{ steps.filter.outputs.staging }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Path Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev:
              - 'environments/dev/**'
              - 'modules/**'
            staging:
              - 'environments/staging/**'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - 'modules/**'

  plan:
    name: "Terraform Plan (${{ matrix.environment }})"
    needs: changes
    strategy:
      matrix:
        environment: [dev, staging, prod]
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs[matrix.environment] == 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-TerraformPlan-${{ matrix.environment }}

      - name: Get AWS Account ID
        id: aws-identity
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=tfstate-${{ steps.aws-identity.outputs.account_id }}-${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate"
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
        working-directory: environments/${{ matrix.environment }}
        continue-on-error: true

      - name: Format Plan Output
        id: show_plan
        run: |
          PLAN_OUTPUT=$(terraform show -no-color tfplan)
          echo "PLAN_TEXT<<EOF" >> $GITHUB_ENV
          echo "$PLAN_OUTPUT" | cut -c1-60000 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        working-directory: environments/${{ matrix.environment }}

      - name: Post Plan Output to PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### 📋 Terraform Plan Results for \`${{ matrix.environment }}\`
            #### Outcome: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${process.env.PLAN_TEXT}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} in #${{ github.event.number }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
