name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  changes:
    name: "Detect Environment Changes"
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Path Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev:
              - 'environments/dev/**'
              - 'modules/**'
            staging:
              - 'environments/staging/**'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - 'modules/**'

  plan:
    name: "Terraform Plan (${{ matrix.environment }})"
    needs: changes
    if: ${{ needs.changes.outputs.environments != '[]' && needs.changes.outputs.environments != '' }}
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.changes.outputs.environments) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Live AWS Path (Runs when AWS_ROLE_ARN secret is set)
      - name: Configure AWS Credentials (OIDC)
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformPlan-${{ matrix.environment }}

      - name: Get AWS Account ID
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: aws-identity
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: |
          terraform init \
            -backend-config="bucket=tfstate-${{ steps.aws-identity.outputs.account_id }}-${{ env.AWS_REGION }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate"
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Init
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: terraform init -backend=false
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform Plan
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: plan
        run: |
          PLAN_OUTPUT=$(terraform plan -no-color -out=tfplan 2>&1) || exit_code=$?
          echo "exit_code=${exit_code:-0}" >> $GITHUB_OUTPUT
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: environments/${{ matrix.environment }}
        continue-on-error: true

      - name: Post Plan Output to PR Comment
        if: ${{ always() && github.event_name == 'pull_request' && env.AWS_ROLE_ARN != '' && steps.plan.outcome != 'skipped' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const planOutput = `${{ steps.plan.outputs.plan_output }}`;
            const outcome = `${{ steps.plan.outcome }}`;
            const environment = `${{ matrix.environment }}`;

            const body = `### 📋 Terraform Plan Results for \`${environment}\`
            #### Outcome: \`${outcome}\`

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Pushed by: @${context.actor} in #${context.issue.number}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check Plan Status
        if: ${{ env.AWS_ROLE_ARN != '' && steps.plan.outcome == 'failure' }}
        run: |
          echo "Terraform plan failed!"
          exit 1
