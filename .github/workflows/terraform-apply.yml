name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Select target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
          - all

permissions:
  id-token: write
  contents: read

env:
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  apply-dev:
    name: "Deploy Dev Environment"
    if: ${{ github.event_name == 'push' || inputs.target_environment == 'dev' || inputs.target_environment == 'all' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # Live AWS Path (Runs when AWS_ROLE_ARN secret is set)
      - name: Configure AWS Credentials via OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformApply-Dev

      - name: Get AWS Account ID
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: aws-identity
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: |
          terraform init \
            -backend-config="bucket=tfstate-${{ steps.aws-identity.outputs.account_id }}-${{ env.AWS_REGION }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="key=dev/terraform.tfstate"
        working-directory: environments/dev

      - name: Terraform Apply
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: terraform apply -auto-approve
        working-directory: environments/dev

      # Offline Validation Path
      - name: Terraform Init & Validate
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: environments/dev

  apply-staging:
    name: "Deploy Staging Environment"
    needs: apply-dev
    if: >-
      ${{
        (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped')
        && (github.event_name == 'push' || inputs.target_environment == 'staging' || inputs.target_environment == 'all')
      }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # Live AWS Path (Runs when AWS_ROLE_ARN secret is set)
      - name: Configure AWS Credentials via OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformApply-Staging

      - name: Get AWS Account ID
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: aws-identity
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: |
          terraform init \
            -backend-config="bucket=tfstate-${{ steps.aws-identity.outputs.account_id }}-${{ env.AWS_REGION }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="key=staging/terraform.tfstate"
        working-directory: environments/staging

      - name: Terraform Apply
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: terraform apply -auto-approve
        working-directory: environments/staging

      # Offline Validation Path
      - name: Terraform Init & Validate
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: environments/staging

  apply-prod:
    name: "Deploy Production Environment"
    needs: apply-staging
    if: >-
      ${{
        (needs.apply-staging.result == 'success' || needs.apply-staging.result == 'skipped')
        && (github.event_name == 'push' || inputs.target_environment == 'prod' || inputs.target_environment == 'all')
      }}
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # Live AWS Path (Runs when AWS_ROLE_ARN secret is set)
      - name: Configure AWS Credentials via OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformApply-Prod

      - name: Get AWS Account ID
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: aws-identity
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: |
          terraform init \
            -backend-config="bucket=tfstate-${{ steps.aws-identity.outputs.account_id }}-${{ env.AWS_REGION }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-state-lock" \
            -backend-config="key=prod/terraform.tfstate"
        working-directory: environments/prod

      - name: Terraform Apply
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: terraform apply -auto-approve
        working-directory: environments/prod

      # Offline Validation Path
      - name: Terraform Init & Validate
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: environments/prod
